<!doctype html><html lang="sr-Latn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Upitnik za biznis plan</title>
<link rel="icon" href="brand/znak.svg" type="image/svg+xml">
<link rel="preload" href="bg-sm.jpg" as="image" media="(max-width:700px)">
<style>
@font-face{font-family:"Questrial";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/questrial-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Questrial";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/questrial-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Layout: jedan ekran = jedno pitanje; crna podloga, tamnozelene kartice, zlatni akcenat */
:root{
  color-scheme:dark;
  --bg:#0B0D0C; --card:#12241D; --ink:#F2EDE1; --ink2:#C4C9BF; --muted:#8C968E;
  --line:rgba(201,162,74,.18); --line2:rgba(242,237,225,.20);
  --accent:#C9A24A; --accent-ink:#0B0D0C; --accent-soft:#1D3A2E;
  --warn:#E0B45C; --warn-soft:#2A2413; --good:#8FC7A5;
  --display:"Questrial", "Century Gothic", "Avenir Next", system-ui, sans-serif;
  --body:"Questrial", "Century Gothic", "Avenir Next", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{min-height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:14px 0 10px;z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--ink2)}
.sec{letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent)}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.linkbtn{background:none;border:0;color:var(--ink2);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:6px 0}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:18px 0 24px}
.q{animation:in .25s ease}
@keyframes in{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.q{animation:none}.bar i{transition:none}}
.num{font-size:14px;color:var(--muted);margin-bottom:6px;font-variant-numeric:tabular-nums}
h1,h2{font-family:var(--display);font-weight:400;letter-spacing:.005em;text-wrap:balance;margin:0}
h1{font-size:32px;line-height:1.18;color:var(--accent)}
h2{font-size:26px;line-height:1.25}
.help{color:var(--ink2);margin:10px 0 0;font-size:16px;max-width:60ch}
.field{margin-top:22px;display:flex;flex-direction:column;gap:10px}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],textarea,select{
  width:100%;font:inherit;font-size:18px;color:var(--ink);background:#0F1C17;border:1px solid var(--line2);border-radius:10px;padding:13px 14px}
textarea{min-height:130px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:13px 14px;cursor:pointer}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;border:1px solid var(--line2);display:grid;place-items:center;font-size:13px;color:var(--ink2);font-weight:600}
.opt small{display:block;color:var(--ink2);font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt[aria-pressed="true"] .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.months{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.months label{display:flex;flex-direction:column;font-size:13px;color:var(--ink2);gap:3px}
.months input{font-size:16px;padding:10px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:8px}
.row-label{font-size:15px;color:var(--ink2);align-self:center}
.hint{font-size:14px;color:var(--muted)}
.foot{position:sticky;bottom:0;background:var(--bg);padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;border-top:1px solid var(--line)}
.btn{font:inherit;letter-spacing:.03em;border-radius:10px;padding:13px 20px;border:1px solid var(--line2);background:var(--card);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);margin-left:auto}
.btn:disabled{opacity:.45;cursor:default}
.saved{font-size:13px;color:var(--muted)}
.note{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:15px;margin-top:16px}
.note{border:1px solid rgba(224,180,92,.35)}.note b{color:var(--warn)}
.linkbox{display:flex;gap:8px;margin-top:14px}
.linkbox input{font-size:14px;padding:11px}
.over{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.over button{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;font:inherit;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);cursor:pointer}
.pill{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.done{background:var(--accent-soft);color:var(--accent)}
.pill.miss{background:var(--warn-soft);color:var(--warn)}
.err{color:var(--warn);font-size:15px;margin-top:8px;min-height:1px}
.demo{font-size:12.5px;color:var(--muted);text-align:center;padding:6px 0 0}

/* Stakleni sloj preko tamnog zelenila */
:root{--glass:rgba(16,28,22,.46);--glass-strong:rgba(12,20,16,.62);--glass-line:rgba(242,237,225,.10);--field:rgba(242,237,225,.10);--field-line:rgba(242,237,225,.16);--cream:#F2EDE1}
body{background:#070A08}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:block}
.top{background:linear-gradient(to bottom,rgba(7,10,8,.78),rgba(7,10,8,0));-webkit-backdrop-filter:none;backdrop-filter:none}
body::before{background:#070A08}
.foot{background:rgba(7,10,8,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--glass-line)}
.q{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(120%);backdrop-filter:blur(22px) saturate(120%);border:1px solid var(--glass-line);border-radius:20px;padding:26px 20px}
h1,h2{font-weight:400;letter-spacing:0}
h1{font-size:34px;color:var(--cream)}
h1 em{font-style:normal;color:var(--accent)}
.help{color:rgba(242,237,225,.72)}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],textarea,select{background:var(--field);border:1px solid var(--field-line);border-radius:12px;color:var(--cream)}
input::placeholder,textarea::placeholder{color:rgba(242,237,225,.45)}
.opt{background:rgba(242,237,225,.07);border:1px solid var(--field-line);border-radius:12px}
.opt:hover{background:rgba(242,237,225,.11)}
.opt[aria-pressed="true"]{background:rgba(201,162,74,.14);border-color:var(--accent);box-shadow:none}
.over button{background:rgba(242,237,225,.07);border:1px solid var(--field-line);border-radius:12px}
.btn{border-radius:12px;background:transparent;border:1px solid rgba(242,237,225,.55);color:var(--cream)}
.btn.primary{background:var(--cream);color:#0B0D0C;border-color:var(--cream)}
.btn.primary:hover{background:#fff}
.bar{background:rgba(242,237,225,.14)}
.note{background:rgba(201,162,74,.10);border:1px solid rgba(201,162,74,.35)}
.num{color:var(--accent);letter-spacing:.08em}
.brandmark{display:inline-block;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:2px 10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
@media (max-width:420px){.q{padding:22px 16px;border-radius:18px}h1{font-size:30px}}

/* Pozadina: drvo, sa tamnim slojem za čitljivost */
body{background:#050705 url(bg.jpg) center 62%/cover no-repeat fixed}
@media (max-width:700px){body{background-image:url(bg-sm.jpg);background-attachment:scroll}}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(4,6,5,.55) 0%,rgba(4,6,5,.35) 45%,rgba(4,6,5,.70) 100%)}
.app{position:relative}
.q{background:rgba(9,15,12,.72);-webkit-backdrop-filter:blur(18px) saturate(115%);backdrop-filter:blur(18px) saturate(115%);border:1px solid rgba(242,237,225,.12);box-shadow:0 20px 60px -20px rgba(0,0,0,.7)}
.help{color:rgba(242,237,225,.80)}
.top{background:linear-gradient(to bottom,rgba(4,6,5,.85),rgba(4,6,5,0))}
.logo{height:26px;width:auto;display:block}
.legal{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:12.5px;color:rgba(242,237,225,.6);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.legal a{color:rgba(242,237,225,.75)}
.consent-links{font-size:14px;color:rgba(242,237,225,.75)}
.consent-links a{color:var(--accent)}
</style>

</head><body>
<div class="app">
  <header class="top">
    <div class="toprow" style="margin-bottom:10px"><img class="logo" src="brand/logo-svetli.svg" alt="Concendia"></div>
    <div class="toprow">
      <span class="sec" id="secname">Upitnik za biznis plan</span>
      <button class="linkbtn" id="overviewBtn" type="button">Pregled i nastavak</button>
    </div>
    <div class="bar"><i id="bar"></i></div>
  </header>
  <main id="main" aria-live="polite"></main>
  <footer class="foot">
    <button class="btn" id="back" type="button">Nazad</button>
    <span class="saved" id="saved"></span>
    <button class="btn primary" id="next" type="button">Dalje</button>
  </footer>
  <div class="demo" id="demo"></div>
  <nav class="legal"><a href="privatnost.html">Politika privatnosti</a><a href="gdpr.html">Tvoja prava (GDPR)</a><span>Milan Živković PR Concendia</span></nav>
</div>

<script>
/* ---------- Pitanja ---------- */
const NOT_IDEA = a => a.faza && a.faza !== "ideja";
const HAS_FIRM = a => ["pausal","knjige","doo"].includes(a.faza);
const WANTS_LOAN = a => (a.svrha||[]).includes("kredit");

const Q = [
 {id:"_intro", type:"intro"},
 {id:"_gate", type:"gate", sec:"Privatnost"},
 // 1. O tebi
 {sec:"O tebi", id:"ime", type:"text", req:true, q:"Kako se zoveš?", help:"Ime i prezime."},
 {sec:"O tebi", id:"email", type:"email", req:true, q:"Tvoj mejl?", help:"Na ovaj mejl ti šaljem nacrt plana."},
 {sec:"O tebi", id:"tel", type:"tel", req:true, q:"Broj telefona?", help:"Za kratak poziv ako nešto nije jasno."},
 {sec:"O tebi", id:"kontakt", type:"multi", q:"Gde ti je najlakše da se čujemo?", opts:[["viber","Viber"],["whatsapp","WhatsApp"],["poziv","Običan poziv"],["mejl","Mejl"]]},
 {sec:"O tebi", id:"grad", type:"text", q:"U kom gradu živiš i gde je posao?", help:"Npr. Užice, posao u Užicu i online."},
 {sec:"O tebi", id:"rodjena", type:"number", q:"Godina rođenja?", help:"Neki programi imaju uslove po godinama (npr. mlade preduzetnice do 35)."},
 {sec:"O tebi", id:"iskustvo", type:"textarea", q:"Koje je tvoje radno iskustvo?", help:"Škola, poslovi, godine iskustva u ovom poslu. Od ovoga pravim CV koji traže banke i fondovi."},

 // 2. Šta ti treba
 {sec:"Šta ti treba", id:"svrha", type:"multi", req:true, q:"Za šta ti treba biznis plan?", help:"Može više.", opts:[["kredit","Kredit u banci"],["grant","Grant ili subvencija"],["investitor","Investitor ili partner"],["sebe","Za sebe, da vidim da li se isplati"]]},
 {sec:"Šta ti treba", id:"banka", type:"multi", show:a=>(a.svrha||[]).some(x=>x!=="sebe"), q:"Sa kim je već bilo razgovora o novcu?", help:"Može više.", opts:[["banka","Banka"],["fond_razvoj","Fond za razvoj Republike Srbije"],["ras","Razvojna agencija Srbije (RAS)"],["inovacioni","Fond za inovacionu delatnost"],["nsz","Nacionalna služba za zapošljavanje (subvencija)"],["lokal","Opština ili grad"],["investitor","Investitor ili poslovni partner"],["nista","Još ni sa kim"]]},
 {sec:"Šta ti treba", id:"banka_detalji", type:"textarea", show:a=>Array.isArray(a.banka)&&a.banka.some(x=>x!=="nista"), q:"Šta su ti rekli?", help:"Kontakt osoba, ekspozitura ili program (npr. SEF), koja dokumenta traže, koji su rokovi."},
 {sec:"Šta ti treba", id:"rok", type:"date", q:"Do kada ti treba plan?", help:"Ako nemaš rok, preskoči."},

 // 3. Faza
 {sec:"Faza biznisa", id:"faza", type:"single", req:true, q:"U kojoj si fazi?", opts:[
   ["ideja","Imam ideju","Još ne radim i nemam firmu"],
   ["neformalno","Već radim, bez firme","Imam kupce, ali bez registracije"],
   ["pausal","Preduzetnički biznis, paušal",""],
   ["knjige","Preduzetnički biznis, knjige",""],
   ["doo","D.o.o.",""],
   ["ne_znam","Ne znam tačno",""]]},
 {sec:"Faza biznisa", id:"firma", type:"text", show:HAS_FIRM, q:"Kako se zove firma?", help:"Pun naziv iz APR-a."},
 {sec:"Faza biznisa", id:"mb", type:"text", show:HAS_FIRM, q:"Matični broj i PIB?", help:"Ako nemaš pri ruci, preskoči. Vratiš se kasnije."},
 {sec:"Faza biznisa", id:"osnovana", type:"date", show:HAS_FIRM, q:"Kada je firma osnovana?", help:"Mnogi krediti i grantovi traže bar 6 ili 12 meseci rada. Datum menja šta možeš da dobiješ."},
 {sec:"Faza biznisa", id:"delatnost", type:"text", show:NOT_IDEA, q:"Koja je tvoja delatnost?", help:"Šifra ako je znaš (npr. 9602 frizerski saloni), ili opiši rečima."},
 {sec:"Faza biznisa", id:"pdv", type:"single", show:HAS_FIRM, q:"Da li si u sistemu PDV-a?", opts:[["da","Da"],["ne","Ne"],["ne_znam","Ne znam"]]},
 {sec:"Faza biznisa", id:"prostor", type:"single", q:"Gde radiš ili ćeš raditi?", opts:[["kuca","Kod kuće"],["zakup","U iznajmljenom prostoru"],["svoj","U svom prostoru"],["online","Samo online"],["teren","Na terenu, kod klijenata"]]},

 // 4. Posao
 {sec:"Tvoj posao", id:"opis", type:"textarea", q:"Opiši posao u 3 rečenice.", help:"Šta radiš, za koga, i zašto bi te izabrali. Kao da objašnjavaš nekom bliskom."},
 {sec:"Tvoj posao", id:"ponuda", type:"textarea", q:"Šta tačno prodaješ i po kojoj ceni?", help:"Svaki proizvod ili usluga u svom redu. Npr. Šišanje 1.200 din, farbanje 3.500 din."},
 {sec:"Tvoj posao", id:"kupci", type:"textarea", q:"Ko su tvoji kupci?", help:"Ko plaća: žene 30-50 iz grada, firme, turisti... I koliko ih je mesečno, ako znaš."},
 {sec:"Tvoj posao", id:"top_kupci", type:"textarea", show:NOT_IDEA, q:"Ko su ti najveći kupci?", help:"Banke i fondovi traže do 5 najvećih kupaca i koliki deo prihoda nose. Ako su fizička lica, napiši samo tip i procenat."},
 {sec:"Tvoj posao", id:"dobavljaci", type:"textarea", q:"Od koga nabavljaš?", help:"Glavni dobavljači materijala, robe ili usluga. Do 5."},
 {sec:"Tvoj posao", id:"kanal", type:"multi", q:"Kako te kupci nalaze?", opts:[["preporuka","Preporuka"],["instagram","Instagram / Facebook"],["oglasi","Plaćeni oglasi"],["lokal","Lokal ili izlog"],["sajt","Sajt / Google"],["firme","Direktno firmama"],["jos","Još nemam kupce"]]},
 {sec:"Tvoj posao", id:"konkurencija", type:"textarea", q:"Ko još radi isto kao ti u tvom kraju?", help:"Imena ili broj. I po čemu se razlikuješ."},
 {sec:"Tvoj posao", id:"tim", type:"single", q:"Ko radi sa tobom?", opts:[["sama","Samo ja"],["porodica","Pomaže porodica"],["saradnici","Imam saradnike"],["zaposleni","Imam zaposlene"]]},
 {sec:"Tvoj posao", id:"tim_detalji", type:"textarea", show:a=>a.tim&&a.tim!=="sama", q:"Koliko ljudi i kako ih plaćaš?", help:"Ugovor, faktura, gotovina. Na izvodu se vidi kome ide novac, zato je bolje da znam unapred."},

 // 5. Brojevi
 {sec:"Brojevi do sada", id:"_brojevi", type:"info", show:NOT_IDEA, q:"Sada brojevi.", help:"Ovo je najvažniji deo plana. Daj tačne podatke, jer ih banka, fond ili investitor proverava. Ako nemaš brojeve pri ruci, preskoči i vrati se kad pogledaš izvode."},
 {sec:"Brojevi do sada", id:"prihod_mes", type:"months", show:NOT_IDEA, q:"Koliko ti je legalo na račun po mesecima?", help:"Poslednjih 12 meseci, u dinarima. Banke i fondovi gledaju svaki mesec posebno, a slab mesec može da obori procenu. Zato mi treba svaki."},
 {sec:"Brojevi do sada", id:"racun", type:"single", show:NOT_IDEA, q:"Gde ti legne novac od kupaca?", opts:[["poslovni","Sve na poslovni račun"],["delom","Delom na poslovni, delom gotovina ili lični"],["licni","Na lični račun ili gotovina"]]},
 {sec:"Brojevi do sada", id:"banka_racun", type:"text", show:HAS_FIRM, q:"U kojoj banci ti je poslovni račun?"},
 {sec:"Brojevi do sada", id:"troskovi", type:"rows", show:NOT_IDEA, q:"Koliko te košta posao mesečno?", help:"Okvirno, u dinarima. Prazno ako nemaš taj trošak.", rows:["Kirija","Materijal i roba","Plate i saradnici","Porez i doprinosi","Knjigovođa","Struja, internet, telefon","Reklame","Programi i aplikacije","Ostalo"]},
 {sec:"Brojevi do sada", id:"licni_trosak", type:"single", show:NOT_IDEA, q:"Da li neke troškove posla plaćaš sa ličnog računa?", opts:[["ne","Ne, sve ide sa poslovnog"],["da","Da, deo"],["sve","Skoro sve"]]},
 {sec:"Brojevi do sada", id:"podizes", type:"number", show:NOT_IDEA, q:"Koliko mesečno uzimaš iz posla za sebe i kuću?", help:"U dinarima. Ovaj broj se poredi sa planom, pa mora biti realan, ne skroman."},
 {sec:"Brojevi do sada", id:"domacinstvo", type:"number", q:"Koliko mesečno troši tvoje domaćinstvo?", help:"Hrana, računi, deca, kredit za stan. U dinarima, okvirno. Ulazi u proračun da li možeš da vraćaš ratu."},
 {sec:"Brojevi do sada", id:"drugi_prihod", type:"text", q:"Imaš li još neki prihod?", help:"Plata, alimentacija, prihod partnera. Ako nemaš, preskoči."},

 // 6. Kredit
 {sec:"Kredit i ulaganje", id:"iznos", type:"number", req:false, q:"Koliko novca ti treba ukupno?", help:"U evrima. Uključi i svoj deo ako ga ulažeš."},
 {sec:"Kredit i ulaganje", id:"namena", type:"rows", q:"Na šta ide novac?", help:"Okvirni iznos u evrima za svaku stavku.", rows:["Oprema i mašine","Vozilo","Adaptacija prostora","Roba i materijal","Marketing i sajt","Obrtna sredstva (kirija, plate prvih meseci)","Ostalo"]},
 {sec:"Kredit i ulaganje", id:"profakture", type:"single", q:"Imaš li ponude ili profakture za to što kupuješ?", help:"Banke i fondovi ih obično traže pre isplate novca.", opts:[["da","Da, za sve"],["delom","Za deo"],["ne","Još ne"]]},
 {sec:"Kredit i ulaganje", id:"ucesce", type:"number", q:"Koliko svog novca možeš da uložiš?", help:"U evrima. Nula je u redu, samo napiši 0."},
 {sec:"Kredit i ulaganje", id:"rata", type:"number", show:WANTS_LOAN, q:"Koliku ratu možeš mirno da plaćaš?", help:"U evrima mesečno. Mirno znači i u lošem mesecu."},
 {sec:"Kredit i ulaganje", id:"dugovi", type:"multi", q:"Šta od ovoga već imaš?", help:"Banke to vide u Kreditnom birou. Bolje da znam unapred.", opts:[["kredit","Kredit (stambeni, gotovinski, za auto)"],["kartica","Kreditnu karticu"],["minus","Dozvoljeni minus"],["jemac","Jemac sam nekome"],["kasnila","Kašnjenje sa ratama u poslednje 2 godine"],["nista","Ništa od ovoga"]]},
 {sec:"Kredit i ulaganje", id:"dugovi_detalji", type:"textarea", show:a=>(a.dugovi||[]).some(x=>x!=="nista"), q:"Koliko mesečno plaćaš za to i do kada?"},
 {sec:"Kredit i ulaganje", id:"obezbedjenje", type:"multi", show:WANTS_LOAN, q:"Šta možeš da ponudiš kao garanciju?", opts:[["menice","Menice"],["vozilo","Vozilo"],["nekretnina","Nekretninu"],["jemac","Imam jemca"],["ne_znam","Ne znam"]]},
 {sec:"Kredit i ulaganje", id:"efekat", type:"textarea", q:"Šta se menja kad dobiješ novac?", help:"Konkretno. Npr. nova mašina, 2 klijentkinje dnevno više, prihod sa 150.000 na 220.000 din mesečno."},

 // 7. Plan
 {sec:"Plan za napred", id:"cilj", type:"number", q:"Koliki mesečni prihod očekuješ za godinu dana?", help:"U dinarima. Realno, ne idealno."},
 {sec:"Plan za napred", id:"sezona", type:"textarea", q:"Ima li tvoj posao jače i slabije mesece?", help:"Koje mesece i koliko slabije. Npr. jul i avgust upola manje."},
 {sec:"Plan za napred", id:"rizik", type:"textarea", q:"Šta te najviše brine?", help:"Šta bi moglo da pođe po zlu. Plan ima SWOT analizu, a iskren odgovor ga jača."},
 {sec:"Plan za napred", id:"zaposljavanje", type:"single", q:"Planiraš li da zaposliš nekog u naredne 2 godine?", opts:[["da","Da"],["mozda","Možda"],["ne","Ne"]]},

 // 8. Dokumenta
 {sec:"Dokumenta", id:"dokumenta", type:"multi", q:"Šta od dokumenata već imaš?", help:"Samo označi. Ne šalješ ništa sada.", opts:[["apr","Rešenje iz APR-a"],["pausal","Rešenje o paušalnom porezu"],["izvodi","Izvode sa računa za 6-12 meseci"],["kpo","KPO knjigu ili završni račun"],["poreska","Potvrdu da nemaš dug prema poreskoj"],["profakture","Profakture za kupovinu"],["ugovori","Ugovore sa kupcima ili dobavljačima"],["knjigovodja","Knjigovođu koji može brzo da pošalje papire"]]},

 // 9. Kraj
 {sec:"Za kraj", id:"nepoznato", type:"textarea", q:"Šta ti je najveća nepoznanica?", help:"Šta želiš da ti neko objasni ili proveri?"},
 {sec:"Za kraj", id:"izvor", type:"single", q:"Odakle znaš za mene?", opts:[["milica","Preko Milice Marković na Instagramu"],["preporuka","Preporuka"],["drugo","Drugo"]]},
 {id:"_kraj", type:"end"}
];

/* ---------- Čuvanje ---------- */
// Lokalno: browser. Na serveru (kad se odobri): Supabase RPC preko CONFIG.
const CONFIG = { supabaseUrl:"https://tefkacbqzynzrifgmtpn.supabase.co", anonKey:"sb_publishable__XIJ9RUNhQzRC5Pi0uYWfg_5Ppkom5Y" };
const LS_KEY = "bp-upitnik-v1";
function newToken(){const a=new Uint8Array(12);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(36).padStart(2,"0")).join("").slice(0,16)}
function lsGet(){try{return JSON.parse(localStorage.getItem(LS_KEY)||"null")}catch(e){return null}}
function lsSet(v){try{localStorage.setItem(LS_KEY,JSON.stringify(v))}catch(e){}}
async function remoteLoad(token){
  if(!CONFIG.supabaseUrl) return null;
  const r=await fetch(CONFIG.supabaseUrl+"/rest/v1/rpc/bp_load",{method:"POST",headers:{apikey:CONFIG.anonKey,"Content-Type":"application/json"},body:JSON.stringify({p_token:token})});
  return r.ok? await r.json(): null;
}
async function remoteSave(token,answers,submitted){
  if(!CONFIG.supabaseUrl) return false;
  const r=await fetch(CONFIG.supabaseUrl+"/rest/v1/rpc/bp_save",{method:"POST",headers:{apikey:CONFIG.anonKey,"Content-Type":"application/json"},body:JSON.stringify({p_token:token,p_answers:answers,p_submitted:submitted})});
  return r.ok;
}
function tokenFromUrl(){const m=(location.hash||"").match(/^#k([a-z0-9]{10,})$/);return m?m[1]:null}

let S = lsGet() || {};
S.answers = S.answers || {};
S.token = tokenFromUrl() || S.token || newToken();
S.i = S.i || 0;
S.submitted = !!S.submitted;
const A = S.answers;

let saveTimer=null;
function save(){
  S.updated = new Date().toISOString();
  if(A.saglasnost===false) return;
  lsSet(S);
  document.getElementById("saved").textContent="Sačuvano";
  clearTimeout(saveTimer);
  if(A.saglasnost===true) saveTimer=setTimeout(()=>{remoteSave(S.token,A,S.submitted).catch(()=>{})},800);
}
function personalLink(){
  const base = CONFIG.supabaseUrl ? location.href.split("#")[0] : "(lični link radi kad upitnik bude objavljen)";
  return CONFIG.supabaseUrl ? base+"#k"+S.token : base;
}

/* ---------- Logika ---------- */
const visible = () => Q.filter(q => !q.show || q.show(A));
function isAnswered(q){
  const v=A[q.id];
  if(q.type==="months"||q.type==="rows") return v && Object.values(v).some(x=>String(x).trim()!=="");
  if(Array.isArray(v)) return v.length>0;
  return v!==undefined && v!==null && String(v).trim()!=="";
}
const askable = q => !["intro","info","end","gate"].includes(q.type);
const IME_Q = () => Q.find(x=>x.id==="ime");
function stats(){
  const v=visible().filter(askable);
  return {total:v.length, done:v.filter(isAnswered).length};
}

/* ---------- Prikaz ---------- */
const main=document.getElementById("main");
const el=(t,attrs={},kids=[])=>{const e=document.createElement(t);for(const[k,v]of Object.entries(attrs)){if(k==="text")e.textContent=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v)}kids.forEach(c=>c&&e.appendChild(c));return e};
let mode="q"; // q | overview

function render(){
  const list=visible();
  if(S.i>=list.length) S.i=list.length-1;
  const q=list[S.i];
  const st=stats();
  document.getElementById("bar").style.width=Math.round(st.done/Math.max(1,st.total)*100)+"%";
  document.getElementById("secname").textContent = mode==="overview" ? "Pregled" : (q.sec||"Upitnik za biznis plan");
  main.innerHTML="";
  const back=document.getElementById("back"), next=document.getElementById("next");
  document.getElementById("err")?.remove();
  if(mode==="overview"){ renderOverview(); back.disabled=false; back.textContent="Nazad"; next.textContent="Nastavi"; return }
  back.disabled = S.i===0; back.textContent="Nazad"; next.hidden=false;
  const box=el("div",{class:"q"});
  if(q.type==="intro"){
    box.append(el("h1",{text:"Upitnik za tvoj biznis plan"}),
      el("p",{class:"help",text:"Na osnovu tvojih odgovora pišem biznis plan za kredit, grant ili investitora. Pitanja su kratka. Treba ti oko 20 minuta, ali ne moraš sve odjednom."}),
      el("p",{class:"help",text:"Sve se čuva samo od sebe. Prekini kad hoćeš i vrati se preko svog ličnog linka. Pitanje koje ne znaš preskoči, pa ga dopuni kasnije."}),
      el("div",{class:"note"},[el("b",{text:"Važno: "}),document.createTextNode("daj tačne podatke. Banka, fond ili investitor ih proverava na izvodima i papirima. Plan pišem samo na osnovu stvarnih brojeva. Ako tražiš plan koji samo lepo izgleda, ovo nije za tebe.")]));
    next.textContent= isAnswered(IME_Q()) ? "Nastavi tamo gde je stalo" : "Počni";
  } else if(q.type==="gate" && mode==="declined"){
    box.append(el("h1",{text:"Poštujemo to i razumemo."}),
      el("p",{class:"help",text:"Hvala ti na interesovanju. Tvoji odgovori se ne čuvaju i ništa nije poslato."}),
      el("p",{class:"help",text:"Srećno sa prikupljanjem sredstava."}),
      el("div",{class:"field"},[el("button",{class:"btn",type:"button",text:"Ipak želim da nastavim",onclick:()=>{mode="q";render()}})]));
    back.disabled=true; next.hidden=true; document.getElementById("saved").textContent="";
  } else if(q.type==="gate"){
    box.append(el("h2",{text:"Tvoji podaci su na sigurnom"}),
      el("p",{class:"help",text:"Strogo poštujemo Politiku privatnosti. Tvoje odgovore vidi samo Milan Živković. Koristimo ih samo za tvoj biznis plan, ne delimo ih ni sa kim bez tvoje dozvole i brišemo ih kad god to zatražiš."}),
      el("p",{class:"help",text:"Zauzvrat te molimo za jedno: podeli iskreno i otvoreno kako stvari stoje, i ono što ide dobro i ono što ne ide. Plan je jak onoliko koliko su tačni podaci na kojima stoji."}),
      Object.assign(el("p",{class:"consent-links"}),{innerHTML:'Pročitaj <a href="privatnost.html" target="_blank" rel="noopener">Politiku privatnosti</a> i <a href="gdpr.html" target="_blank" rel="noopener">svoja prava</a>.'}));
    const yes=el("button",{class:"opt",type:"button","aria-pressed":String(A.saglasnost===true),id:"f_gate_da"},[el("span",{class:"k",text:A.saglasnost===true?"✓":"A"}),el("span",{text:"Pristajem i delim iskreno"})]);
    const no=el("button",{class:"opt",type:"button",id:"f_gate_ne"},[el("span",{class:"k",text:"B"}),el("span",{text:"Ne pristajem"})]);
    yes.addEventListener("click",()=>{A.saglasnost=true;A.saglasnost_at=new Date().toISOString();save();render();setTimeout(()=>go(1),220)});
    no.addEventListener("click",()=>{A.saglasnost=false;delete A.saglasnost_at;try{localStorage.removeItem(LS_KEY)}catch(e){};mode="declined";render()});
    box.append(el("div",{class:"field"},[yes,no]));
    next.textContent="Dalje";
  } else if(q.type==="end"){
    const s=stats();
    box.append(el("h1",{text: S.submitted? "Hvala, poslato." : "Još jedan korak."}),
      el("p",{class:"help",text:`Odgovoreno je ${s.done} od ${s.total} pitanja.`+(s.done<s.total?" Ostala možeš da dopuniš i posle slanja.":"")}),
      el("p",{class:"help",text:"Javiću ti se u roku od 3 radna dana sa sledećim korakom i spiskom onoga što još fali."}));
    box.append(linkBox());
    next.textContent= S.submitted? "Pogledaj odgovore" : "Pošalji";
  } else if(q.type==="info"){
    box.append(el("h2",{text:q.q}),el("p",{class:"help",text:q.help}));
    next.textContent="Dalje";
  } else {
    const ai=list.filter(askable).indexOf(q)+1, at=list.filter(askable).length;
    box.append(el("div",{class:"num",text:`${ai} / ${at}`+(q.req?" · obavezno":"")}), el("h2",{text:q.q}));
    if(q.help) box.append(el("p",{class:"help",text:q.help}));
    box.append(input(q));
    next.textContent= isAnswered(q)||q.req ? "Dalje" : "Preskoči";
  }
  main.append(box);
  const f=box.querySelector("input,textarea,.opt"); if(f && window.innerWidth>700) f.focus();
}

function linkBox(){
  const wrap=el("div");
  wrap.append(el("p",{class:"help",text:"Tvoj lični link za nastavak. Sačuvaj ga ili ga pošalji sebi u poruci. Preko njega nastavljaš sa bilo kog telefona."}));
  const inp=el("input",{type:"text",id:"plink",readonly:"",value:personalLink()});
  const b=el("button",{class:"btn",type:"button",text:"Kopiraj",onclick:async()=>{try{await navigator.clipboard.writeText(inp.value);b.textContent="Kopirano"}catch(e){inp.select()}}});
  wrap.append(el("div",{class:"linkbox"},[inp,b]));
  return wrap;
}

function input(q){
  const w=el("div",{class:"field"});
  const set=v=>{A[q.id]=v;save();updateNext(q)};
  const v=A[q.id];
  if(["text","email","tel","number","date"].includes(q.type)){
    const i=el("input",{type:q.type,id:"f_"+q.id,inputmode:q.type==="number"?"numeric":"",autocomplete:{ime:"name",email:"email",tel:"tel"}[q.id]||"off"});
    if(v!=null) i.value=v;
    i.addEventListener("input",()=>set(i.value));
    i.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();go(1)}});
    w.append(i);
  } else if(q.type==="textarea"){
    const t=el("textarea",{id:"f_"+q.id}); if(v) t.value=v;
    t.addEventListener("input",()=>set(t.value));
    w.append(t, el("div",{class:"hint",text:"Enter za novi red. Dugme Dalje za sledeće pitanje."}));
  } else if(q.type==="single"||q.type==="multi"){
    const keys="ABCDEFGH";
    q.opts.forEach((o,ix)=>{
      const on = q.type==="multi" ? (v||[]).includes(o[0]) : v===o[0];
      const b=el("button",{class:"opt",type:"button","aria-pressed":String(on),id:`f_${q.id}_${o[0]}`},[el("span",{class:"k",text:keys[ix]}),el("span",{},[document.createTextNode(o[1]),o[2]?el("small",{text:o[2]}):null])]);
      b.addEventListener("click",()=>{
        if(q.type==="single"){ set(o[0]); render(); setTimeout(()=>go(1),220) }
        else { let a=[...(A[q.id]||[])]; if(o[0]==="nista"||o[0]==="jos") a=a.includes(o[0])?[]:[o[0]]; else { a=a.filter(x=>x!=="nista"&&x!=="jos"); a=a.includes(o[0])?a.filter(x=>x!==o[0]):[...a,o[0]] } set(a); render() }
      });
      w.append(b);
    });
    if(q.type==="multi") w.append(el("div",{class:"hint",text:"Može više odgovora."}));
  } else if(q.type==="months"){
    const g=el("div",{class:"months"}); const now=new Date(); const val=v||{};
    for(let k=12;k>=1;k--){
      const d=new Date(now.getFullYear(),now.getMonth()-k,1);
      const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
      const lab=d.toLocaleDateString("sr-Latn",{month:"long",year:"numeric"});
      const i=el("input",{type:"number",inputmode:"numeric",id:`f_m_${key}`,placeholder:"din"}); if(val[key]!=null) i.value=val[key];
      i.addEventListener("input",()=>{const nv={...(A[q.id]||{})};nv[key]=i.value;set(nv)});
      g.append(el("label",{for:`f_m_${key}`},[document.createTextNode(lab),i]));
    }
    w.append(g);
  } else if(q.type==="rows"){
    const r=el("div",{class:"rows"}); const val=v||{};
    q.rows.forEach((name,ix)=>{
      const i=el("input",{type:"number",inputmode:"numeric",id:`f_${q.id}_${ix}`,"aria-label":name}); if(val[name]!=null) i.value=val[name];
      i.addEventListener("input",()=>{const nv={...(A[q.id]||{})};nv[name]=i.value;set(nv)});
      r.append(el("div",{class:"row"},[el("span",{class:"row-label",text:name}),i]));
    });
    w.append(r);
  } else if(q.type==="consent"){
    const b=el("button",{class:"opt",type:"button","aria-pressed":String(!!v),id:"f_saglasnost"},[el("span",{class:"k",text:v?"✓":""}),el("span",{text:"Slažem se"})]);
    b.addEventListener("click",()=>{set(!A[q.id]);render()});
    w.append(b, Object.assign(el("div",{class:"consent-links"}),{innerHTML:'Detalji: <a href="privatnost.html" target="_blank" rel="noopener">Politika privatnosti</a> i <a href="gdpr.html" target="_blank" rel="noopener">tvoja prava</a>.'}));
  }
  return w;
}

function updateNext(q){ const n=document.getElementById("next"); if(askable(q)&&q.type!=="consent") n.textContent=isAnswered(q)||q.req?"Dalje":"Preskoči" }

function renderOverview(){
  const box=el("div",{class:"q"}); const s=stats();
  box.append(el("h2",{text:"Šta je popunjeno"}),el("p",{class:"help",text:`${s.done} od ${s.total} pitanja. Dodirni deo da dopuniš.`}));
  const secs={}; const list=visible();
  list.forEach((q,ix)=>{ if(!askable(q))return; (secs[q.sec]=secs[q.sec]||{done:0,total:0,first:null,firstMiss:null}); const o=secs[q.sec]; o.total++; if(isAnswered(q))o.done++; else if(o.firstMiss===null)o.firstMiss=ix; if(o.first===null)o.first=ix });
  const ov=el("div",{class:"over"});
  Object.entries(secs).forEach(([name,o])=>{
    const full=o.done===o.total;
    ov.append(el("button",{type:"button",onclick:()=>{mode="q";S.i= full?o.first:o.firstMiss;save();render()}},[el("span",{text:name}),el("span",{class:"pill "+(full?"done":"miss"),text: full?"gotovo":`fali ${o.total-o.done}`})]));
  });
  box.append(ov, linkBox());
  main.append(box);
}

function showErr(msg){document.getElementById("err")?.remove();const e=el("div",{class:"err",id:"err",text:msg});main.querySelector(".q")?.append(e)}

function go(d){
  if(mode==="declined") return;
  if(mode==="overview"){ mode="q"; if(d>0){const l=visible();const m=l.findIndex(q=>askable(q)&&!isAnswered(q));S.i=m>=0?m:l.length-1} render(); return }
  const list=visible(); const q=list[S.i];
  if(d>0 && q.type==="end"){ if(!S.submitted){ if(!A.saglasnost||!A.ime||!A.email){ const l=visible(); S.i= A.saglasnost!==true ? l.findIndex(x=>x.type==="gate") : l.findIndex(x=>x.req&&!isAnswered(x)); render(); showErr("Bez ovog ne mogu da sačuvam tvoje odgovore."); return } S.submitted=true; S.submittedAt=new Date().toISOString(); save(); render() } else { mode="overview"; render() } return }
  if(d>0 && q.type==="intro" && isAnswered(IME_Q()) && A.saglasnost===true){ const m=list.findIndex(x=>askable(x)&&!isAnswered(x)); S.i = m>=0?m:list.length-1; save(); render(); return }
  if(d>0 && q.type==="gate" && A.saglasnost!==true){ showErr("Izaberi jedan od dva odgovora."); return }
  if(d>0 && q.req && !isAnswered(q)){ showErr(q.type==="consent"?"Potrebna je saglasnost da bih mogao da koristim odgovore.":(["ime","email","tel"].includes(q.id)?"Ovo mi treba da bih mogao da ti se javim.":"Ovo pitanje mi treba da znam kakav plan pravimo.")); return }
  if(d>0 && q.type==="email" && A.email && !/^\S+@\S+\.\S+$/.test(A.email)){ showErr("Proveri mejl, nešto fali."); return }
  S.i=Math.max(0,Math.min(list.length-1,S.i+d)); save(); render(); window.scrollTo(0,0);
}

document.getElementById("next").addEventListener("click",()=>go(1));
document.getElementById("back").addEventListener("click",()=>{ if(mode==="overview"){mode="q";render()} else go(-1) });
document.getElementById("overviewBtn").addEventListener("click",()=>{ if(mode==="declined")return; mode= mode==="overview"?"q":"overview"; render() });
document.addEventListener("keydown",e=>{
  if(mode!=="q")return; const q=visible()[S.i]; if(!q||!q.opts)return;
  if(["INPUT","TEXTAREA"].includes(document.activeElement?.tagName))return;
  const ix="abcdefgh".indexOf(e.key.toLowerCase()); if(ix>=0&&q.opts[ix]) document.getElementById(`f_${q.id}_${q.opts[ix][0]}`)?.click();
});

if(!CONFIG.supabaseUrl) document.getElementById("demo").textContent="Probna verzija: odgovori se čuvaju samo u ovom pregledaču.";

(async()=>{
  const t=tokenFromUrl();
  if(t){ try{ const r=await remoteLoad(t); if(r&&r.answers){ Object.assign(A,r.answers); S.submitted=!!r.submitted; lsSet(S) } }catch(e){} }
  render();
})();
</script>
